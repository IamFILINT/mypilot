name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

permissions:
  contents: read

# We use yarn locally (yarn.lock is the source of truth). npm ci fights
# the @visx React-19 peer mismatch unless legacy-peer-deps is set, and
# legacy-peer-deps triggers npm's optional-native-binding bug (cli#4828)
# for rolldown/esbuild binaries. Yarn just warns and installs cleanly.

jobs:
  lint:
    name: Lint (TS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: app/app/yarn.lock

      - name: Rewrite git+ssh → https (transitive deps use ssh://git@github.com)
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install dependencies
        working-directory: app/app
        run: yarn install --frozen-lockfile

      - name: ESLint
        working-directory: app/app
        run: yarn lint

  typecheck:
    name: Typecheck (TS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Hard-fail: tsc --noEmit must be clean.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: app/app/yarn.lock

      - name: Rewrite git+ssh → https (transitive deps use ssh://git@github.com)
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install dependencies
        working-directory: app/app
        run: yarn install --frozen-lockfile

      - name: tsc --noEmit
        working-directory: app/app
        run: yarn typecheck

  unit:
    name: Unit + integration (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: app/app/yarn.lock

      - name: Rewrite git+ssh → https (transitive deps use ssh://git@github.com)
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install dependencies
        working-directory: app/app
        run: yarn install --frozen-lockfile

      - name: Check SessionDb schema manifest
        working-directory: app/app
        run: yarn db:schema:check

      - name: Run vitest with coverage
        working-directory: app/app
        run: yarn test:coverage

      - name: Upload coverage (TS)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ts
          path: app/app/tests/results/coverage/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-results
          path: app/app/tests/results/
          if-no-files-found: ignore

  windows-spawn:
    name: Windows spawn smoke (cmd.exe shim)
    runs-on: windows-latest
    timeout-minutes: 10
    # Guards the Windows-only regression where cmd.exe + .cmd shims mangle
    # multi-line prompts passed via argv (codex saw second word as an
    # unexpected positional). The fix routes the prompt through stdin; this
    # job runs the smoke test that verifies the round-trip on a real
    # cmd.exe.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: app/app/yarn.lock

      - name: Rewrite git+ssh → https (transitive deps use ssh://git@github.com)
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install dependencies
        working-directory: app/app
        run: yarn install --frozen-lockfile

      - name: Run Windows-only spawn tests
        working-directory: app/app
        run: yarn vitest run tests/unit/hl/codexStdinWindows.test.ts

  linux-spawn:
    name: Linux spawn smoke (POSIX shim)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Guards the POSIX execution path used by Linux desktop sessions: CLI
    # shims should be found through PATH, spawned without shell wrapping, and
    # receive multi-line prompts over stdin unchanged.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: app/app/yarn.lock

      - name: Rewrite git+ssh → https (transitive deps use ssh://git@github.com)
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install dependencies
        working-directory: app/app
        run: yarn install --frozen-lockfile

      - name: Run Linux-only spawn tests
        working-directory: app/app
        run: yarn vitest run tests/unit/hl/codexStdinLinux.test.ts

  sidecar:
    name: Python sidecar (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # NOT `uv sync`. pyproject.toml declares
      #   [tool.uv.sources]
      #   browser-use = { path = "../../browser-use", editable = true }
      # which resolves outside the repository. With no fork checkout in CI,
      # `uv sync --frozen` dies with the opaque "Failed to determine
      # installation plan". The tests are written for exactly this situation —
      # tests/test_recovery.py states "browser-use is not importable in a bare
      # test environment" and stubs it — so we install the dev tooling directly.
      # pytest picks up [tool.pytest.ini_options] (pythonpath = src,
      # asyncio_mode = auto) from pyproject.toml automatically.
      - name: Install test tooling
        working-directory: sidecar
        run: pip install 'pytest>=8.3' 'pytest-asyncio>=0.24' 'ruff>=0.7'

      - name: Run pytest
        working-directory: sidecar
        run: python -m pytest tests/ -v

      - name: Run ruff
        working-directory: sidecar
        run: ruff check src/ tests/

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # `yarn package` runs the forge prePackage hook (stage-sidecar-resources.mjs),
      # which hard-fails when it cannot find the browser-use fork:
      #   stage-sidecar-resources: missing required source
      #     /home/runner/work/mypilot/browser-use/pyproject.toml
      # It lives *outside* the checkout (a sibling of the workspace dir), which is
      # why release.yml clones it there too, and it is wired in through a
      # repository variable rather than vendored.
      #
      # BROWSER_USE_URL currently points at UPSTREAM browser-use/browser-use.
      # There is no fork -- none has ever existed under the IamFILINT account.
      # The .gitignore note describing ../browser-use as "upstream browser-use
      # + our patch set" is aspirational; the local checkout is pristine
      # upstream with no local commits.
      #
      # When that variable is absent we skip with an explicit notice instead of
      # failing on a missing third-party checkout. Set BROWSER_USE_URL and
      # this job starts running with no further edits.
      - name: Check browser-use fork configuration
        id: fork
        env:
          BROWSER_USE_URL: ${{ vars.BROWSER_USE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BROWSER_USE_URL}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Repository variable BROWSER_USE_URL is not set, so E2E is skipped. 'yarn package' cannot stage the agent runtime without the browser-use fork. Set the variable to enable this job."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.fork.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: app/app/yarn.lock

      - name: Rewrite git+ssh → https (transitive deps use ssh://git@github.com)
        if: steps.fork.outputs.present == 'true'
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Check out the browser-use fork
        if: steps.fork.outputs.present == 'true'
        env:
          BROWSER_USE_URL: ${{ vars.BROWSER_USE_URL }}
        run: |
          set -euo pipefail
          git clone --depth 1 "${BROWSER_USE_URL}" "$(dirname "$GITHUB_WORKSPACE")/browser-use"
          test -f "$(dirname "$GITHUB_WORKSPACE")/browser-use/pyproject.toml"

      - name: Install dependencies
        if: steps.fork.outputs.present == 'true'
        working-directory: app/app
        run: yarn install --frozen-lockfile

      - name: Install Playwright
        if: steps.fork.outputs.present == 'true'
        working-directory: app/app
        run: npx playwright install --with-deps chromium

      # Required before `yarn package`. The forge prePackage hook runs
      # app/app/scripts/build-python-runtime.mjs, which needs uv on PATH to
      # provision the relocatable CPython that ships as
      # resources/python-runtime. release.yml installs uv in both its mac and
      # Windows packaging jobs for exactly this reason; the E2E job was
      # missing it, so packaging died with a bare exit code 1.
      - name: Install uv
        if: steps.fork.outputs.present == 'true'
        uses: astral-sh/setup-uv@v6

      - name: Build app
        if: steps.fork.outputs.present == 'true'
        working-directory: app/app
        run: yarn package

      # Invariant: every native .node loaded by Electron during E2E must target
      # Electron's ABI (145 for Electron 41), not system Node's (127 for Node
      # 22). `yarn install` builds better-sqlite3 for Node, and forge's
      # packageAfterPrune rebuild only touches the packaged copy under out/, so
      # the source node_modules stays Node-ABI. The E2E specs omit
      # executablePath on purpose and so resolve node_modules/electron, loading
      # .vite/build/main.js straight from this tree -- hence the rebuild here,
      # after install and before the suite runs. Reuses @electron/rebuild, which
      # is already a dependency. Scoped to this job only: rebuilding in place
      # would break vitest, which needs the Node-ABI build.
      - name: Rebuild native modules for Electron
        if: steps.fork.outputs.present == 'true'
        working-directory: app/app
        run: yarn rebuild:electron

      # Electron needs a display and GitHub's runner is headless. xvfb is part
      # of the runner image; installed only if absent so this stays honest if
      # the image changes.
      - name: Ensure Xvfb is available
        if: steps.fork.outputs.present == 'true'
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Run E2E tests
        if: steps.fork.outputs.present == 'true'
        working-directory: app/app
        run: xvfb-run --auto-servernum yarn e2e
